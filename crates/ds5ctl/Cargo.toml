[package]
name = "ds5ctl"
description = "Configure DualSense controllers on Linux"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
dualsense = { path = "../dualsense", features = ["serde"] }
libc = "0.2"
clap = { version = "4", features = ["derive"] }
eframe = { version = "0.36", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"] }
# Only to switch on winit features eframe does not re-export.
winit = { version = "0.30.13", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen", "wayland-csd-adwaita"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zbus = "5"
